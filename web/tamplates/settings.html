{% extends "base.html" %}
{% block title %}settings — osint-srv{% endblock %}

{% block content %}
<h1>settings</h1>

{% if saved %}
<div class="toast">saved</div>
{% endif %}

<form method="post" class="card">
  <label>
    default proxy
    <input type="text" name="proxy" value="{{ settings.proxy or '' }}"
           placeholder="http://127.0.0.1:8080 or socks5://...">
  </label>
  <div class="grid">
    <label>
      request timeout (seconds)
      <input type="number" name="timeout" min="1" step="1"
             value="{{ settings.timeout or 10 }}">
    </label>
    <label>
      max concurrent
      <input type="number" name="concurrent" min="1" max="200"
             value="{{ settings.concurrent or 50 }}">
    </label>
    <label>
      cache TTL (hours)
      <input type="number" name="cache_ttl" min="1" step="1"
             value="{{ settings.cache_ttl or 24 }}">
    </label>
    <label>
      default phone region
      <input type="text" name="region" maxlength="2"
             value="{{ settings.region or 'IN' }}">
    </label>
  </div>
  <button type="submit">save</button>
</form>

<p class="dim">no api keys. everything runs on public endpoints.</p>
{% endblock %}
